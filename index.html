<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #121420;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}
#canvas { display: block; position: fixed; inset: 0; outline: none; }
#canvas:focus { outline: none; }

#boot {
	position: fixed; inset: 0; z-index: 10;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
	background: #121420;
	transition: opacity .35s ease;
}
#boot.done { opacity: 0; pointer-events: none; }
#boot img { max-width: min(64vw, 560px); max-height: 40vh; object-fit: contain; }
#bar { width: min(56vw, 440px); height: 8px; border-radius: 4px; background: #262a3c; overflow: hidden; }
#bar > div { width: 0%; height: 100%; background: #e5322d; transition: width .12s linear; }
#bar.wait > div { width: 40%; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0 } to { margin-left: 60% } }

#fail {
	display: none; position: fixed; inset: 0; z-index: 20; padding: 24px; box-sizing: border-box;
	background: #121420; color: #e8e8ee; font: 700 20px/1.4 system-ui, sans-serif;
	align-items: center; justify-content: center; text-align: center; flex-direction: column; gap: 14px;
}
#fail button {
	font: 800 18px system-ui, sans-serif; color: #fff; background: #e5322d; border: 0; border-radius: 10px;
	padding: 12px 28px; cursor: pointer;
}

/* Portrait phones: the game is landscape-only. */
#turn {
	display: none; position: fixed; inset: 0; z-index: 15; background: #121420;
	align-items: center; justify-content: center;
}
#turn svg { width: 96px; height: 96px; animation: spin 2.2s ease-in-out infinite; }
@keyframes spin { 0%, 15% { transform: rotate(0) } 55%, 100% { transform: rotate(-90deg) } }
@media (orientation: portrait) and (pointer: coarse) { #turn.on { display: flex; } }

/* The text box for typing on a phone (the game canvas can't use the phone's keyboard itself). */
#tin {
	display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 25; box-sizing: border-box;
	padding: max(10px, env(safe-area-inset-top)) 14px 10px; background: rgba(8, 9, 16, .84);
	-webkit-user-select: text; user-select: text; touch-action: manipulation;
}
#tin.on { display: block; }
#tin input {
	display: block; width: min(100%, 760px); margin: 0 auto; box-sizing: border-box; padding: 12px 16px;
	font: 700 22px system-ui, -apple-system, sans-serif; border: 0; border-radius: 12px; background: #f2f2f4; color: #14151c;
	outline: none; -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none;
}

/* ADD TO HOME SCREEN steps (iOS and browsers that can't install with one tap). */
#addhome {
	display: none; position: fixed; inset: 0; z-index: 30; background: rgba(8, 9, 16, .86);
	align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
	font: 800 22px/1.3 system-ui, -apple-system, sans-serif; color: #f2f2f6; touch-action: manipulation;
}
#addhome.on { display: flex; }
#addhome .card {
	width: min(92vw, 620px); box-sizing: border-box; padding: 22px 26px; border-radius: 18px;
	background: #1c1f30; box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
}
#addhome .step { display: flex; align-items: center; gap: 16px; padding: 10px 0; }
#addhome .num {
	flex: none; width: 38px; height: 38px; border-radius: 50%; background: #e5322d; color: #fff;
	display: flex; align-items: center; justify-content: center; font-size: 20px;
}
#addhome .step svg { flex: none; width: 34px; height: 34px; }
#addhome .done {
	display: block; margin: 12px auto 0; font: 800 18px system-ui, sans-serif; color: #fff; background: #e5322d;
	border: 0; border-radius: 10px; padding: 11px 34px; cursor: pointer;
}
</style>

<script>
/* Keep the game running while its tab is in the background.
   Browsers stop requestAnimationFrame for a hidden or covered tab (document.hidden is not always set), which
   would freeze a hosted match for every other player the moment the host switches tabs. A Worker (its timers
   are not throttled) runs the frame callbacks the browser is holding back: one that has waited more than a
   frame or two is called from the Worker's tick instead. */
(function () {
	const nativeRaf = window.requestAnimationFrame.bind(window);
	const nativeCaf = window.cancelAnimationFrame.bind(window);
	const pending = new Map();
	let nextId = 1;
	let ticker = null;

	function fire(id, ts) {
		const rec = pending.get(id);
		if (!rec) return;
		pending.delete(id);
		nativeCaf(rec.raf);
		rec.cb(ts === undefined ? performance.now() : ts);
	}
	function startTicker() {
		if (ticker) return;
		try {
			const src = 'let t=setInterval(()=>postMessage(0),16);onmessage=()=>{clearInterval(t);close()}';
			ticker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
			ticker.onmessage = function () {
				const now = performance.now();
				pending.forEach(function (rec, id) { if (now - rec.t > 48) fire(id); });
			};
		} catch (e) { ticker = null; }
	}
	window.requestAnimationFrame = function (cb) {
		const id = nextId++;
		pending.set(id, { cb: cb, t: performance.now(), raf: nativeRaf(function (ts) { fire(id, ts); }) });
		startTicker();
		return id;
	};
	window.cancelAnimationFrame = function (id) {
		const rec = pending.get(id);
		if (rec) { nativeCaf(rec.raf); pending.delete(id); }
	};
})();
</script>

<script src="index.js"></script>
<script>
/* The engine (index.wasm, ~39 MB) ships gzipped as index.wasm.gz (~10 MB): GitHub Pages doesn't compress it.
   The loader's fetch of index.wasm is answered with the unzipped stream. */
(function () {
	if (typeof DecompressionStream === 'undefined') return;
	const realFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		if (!/index\.wasm(\?.*)?$/.test(url)) return realFetch(input, init);
		return realFetch(url.replace(/index\.wasm/, 'index.wasm.gz'), init).then(function (r) {
			if (!r.ok) return realFetch(input, init);
			const body = (r.headers.get('content-encoding') || '').indexOf('gzip') >= 0 ? r.body : r.body.pipeThrough(new DecompressionStream('gzip'));
			return new Response(body, { status: 200, headers: { 'content-type': 'application/wasm' } });
		});
	};
})();

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":24787984,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
/* Test flags, only on a local server: index.html?--signal-url=ws://127.0.0.1:8787&--perf */
(function () {
	if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
	const extra = [];
	new URLSearchParams(location.search).forEach(function (v, k) {
		if (k.indexOf('--') === 0) extra.push(v === '' ? k : k + '=' + v);
	});
	if (extra.length) GODOT_CONFIG.args = ['--'].concat(extra);
})();
const engine = new Engine(GODOT_CONFIG);

const bootEl = document.getElementById('boot');
const barEl = document.getElementById('bar');
const fillEl = barEl.firstElementChild;
const failEl = document.getElementById('fail');
document.getElementById('retry').onclick = function () { location.reload(); };

function fail(msg) {
	document.getElementById('failmsg').textContent = msg;
	failEl.style.display = 'flex';
	bootEl.classList.add('done');
}

/* Helpers the game calls through JavaScriptBridge. */
window.stickshot = {
	touch: function () { return matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); },
	fullscreen: function () {
		const el = document.documentElement;
		if (document.fullscreenElement) { document.exitFullscreen(); return; }
		(el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : Promise.reject()).then(function () {
			if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
		}).catch(function () {});
	},
	isFullscreen: function () { return !!document.fullscreenElement; },
	hidden: function () { return document.hidden; },
	/* the phone's keyboard: how much of the page it covers (the visual viewport shrinks while it is up) */
	kbHeight: function () { const v = window.visualViewport; return v ? Math.max(0, Math.round(window.innerHeight - v.height - v.offsetTop)) : 0; },
	copy: function (text) { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); },
	paste: function () {
		if (!navigator.clipboard || !navigator.clipboard.readText) return;
		navigator.clipboard.readText().then(function (t) { window.stickshot.pasted = t; }).catch(function () {});
	},
	pasted: ''
};

/* ADD TO HOME SCREEN.
   installState(): "none" (nothing to show: already on the home screen, or this browser can't), "prompt"
   (Chrome / Edge / Samsung: one tap installs it), "ios" (no install API: the button shows the Share steps),
   "manual" (an Android browser without the prompt: the menu steps). The game polls it for its menu button and
   calls install() when it's tapped. Local test: index.html?--install-test=ios|prompt|manual|standalone */
(function () {
	const ua = navigator.userAgent;
	let test = '';
	if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
		test = new URLSearchParams(location.search).get('--install-test') || '';
	}
	const ios = test === 'ios' || /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const touch = window.stickshot.touch() || ios;
	let deferred = null;
	let flag = false;
	try { flag = localStorage.getItem('ss_installed') === '1'; } catch (e) {}

	function standalone() {
		if (test === 'standalone') return true;
		return navigator.standalone === true || ['standalone', 'minimal-ui', 'window-controls-overlay'].some(function (m) {
			return matchMedia('(display-mode: ' + m + ')').matches;
		});
	}
	window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
	window.addEventListener('appinstalled', function () {
		deferred = null; flag = true;
		try { localStorage.setItem('ss_installed', '1'); } catch (e) {}
	});
	/* (installed, then opened in a tab: Chrome never offers the prompt again, so the flag only matters when it didn't) */
	if (standalone()) { try { localStorage.setItem('ss_installed', '1'); } catch (e) {} }

	window.stickshot.installState = function () {
		if (standalone()) return 'none';
		if (test === 'prompt') return 'prompt';
		if (deferred) return 'prompt';
		if (ios) return 'ios';
		if (test === 'manual') return 'manual';
		if (touch && !('onbeforeinstallprompt' in window)) return flag ? 'none' : 'manual';
		return 'none';
	};

	const help = document.getElementById('addhome');
	function closeHelp() { help.classList.remove('on'); }
	document.getElementById('ahdone').onclick = closeHelp;
	help.addEventListener('click', function (e) { if (e.target === help) closeHelp(); });

	window.stickshot.install = function () {
		const s = window.stickshot.installState();
		if (s === 'prompt' && deferred) {
			const p = deferred;
			deferred = null;
			p.prompt();
			p.userChoice.catch(function () {});
		} else if (s === 'ios' || s === 'manual' || s === 'prompt') {
			document.getElementById('ah1').textContent = s === 'ios' ? 'Tap Share' : 'Tap the menu';
			document.getElementById('ah2').textContent = s === 'ios' ? 'Add to Home Screen' : 'Add to Home screen / Install';
			help.classList.add('on');
		}
	};
})();

/* Saved name, colours, controls and settings live in the browser's storage (the game's user:// folder).
   Ask the browser not to clear it when space runs low (it says yes for an installed or often-used game). */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}

/* TYPING ON A PHONE. The game asks for this text box when a text field is tapped (textOpen), copies what is typed
   into the field each frame (textPoll) and closes it (textClose). The browser raises the phone's keyboard for it. */
(function () {
	const S = window.stickshot;
	const box = document.getElementById('tin');
	const inp = document.getElementById('tinput');
	let open = false, dirty = false, submitted = false, closed = false;
	function refocus() { if (open) { try { inp.focus(); } catch (e) {} } }
	/* The engine's own keyboard bridge (a hidden "ime" element, and the canvas) calls focus() ~100 ms after the tap and
	   takes the focus from this box, which puts the phone's keyboard away again. While the box is open nothing else
	   gets the focus. (Found on a real Android phone: the keyboard flashed up and went.) */
	const nativeFocus = HTMLElement.prototype.focus;
	HTMLElement.prototype.focus = function () {
		if (open && this !== inp) return;
		return nativeFocus.apply(this, arguments);
	};
	S.textOpen = function (text, ph, secret, max, mode) {
		inp.value = text || '';
		inp.placeholder = ph || '';
		inp.type = secret ? 'password' : 'text';
		inp.maxLength = max > 0 ? max : 524288;
		inp.inputMode = (mode === 'numeric' || mode === 'decimal') ? mode : 'text';
		open = true; dirty = true; submitted = false; closed = false;
		box.classList.add('on');
		refocus();
		try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
		/* (a keyboard only comes up from a tap: if this ran before the finger lifted, focus again as it does) */
		const again = function () {
			document.removeEventListener('touchend', again, true);
			document.removeEventListener('pointerup', again, true);
			setTimeout(refocus, 0);
		};
		document.addEventListener('touchend', again, true);
		document.addEventListener('pointerup', again, true);
		setTimeout(function () {
			document.removeEventListener('touchend', again, true);
			document.removeEventListener('pointerup', again, true);
		}, 1500);
	};
	S.textClose = function () { open = false; box.classList.remove('on'); inp.blur(); };
	S.textSecret = function (on) { inp.type = on ? 'password' : 'text'; };
	S.textPoll = function () {
		if (!dirty && !submitted && !closed) return '';
		const out = JSON.stringify({ t: inp.value, s: submitted, c: closed });
		dirty = false; submitted = false; closed = false;
		return out;
	};
	inp.addEventListener('input', function () { dirty = true; });
	inp.addEventListener('keydown', function (e) {
		if (e.key === 'Enter') { e.preventDefault(); submitted = true; S.textClose(); }
	});
	/* Focus moving away (the canvas takes it back on every tap) doesn't close the box: it asks for the focus again, and
	   the box stays on screen so a tap on it brings the keyboard up. The game closes it when its field loses the focus. */
	inp.addEventListener('blur', function () { if (open) setTimeout(refocus, 40); });
	let kbSeen = false;
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', function () {
			if (!open) { kbSeen = false; return; }
			const covered = window.innerHeight - window.visualViewport.height;
			if (covered > 120) kbSeen = true;
			else if (kbSeen) { kbSeen = false; closed = true; open = false; box.classList.remove('on'); }  /* (the keyboard was put away) */
		});
	}
})();

/* A NEWER VERSION. The page, the service worker's cache and the browser's own cache can all hold an older copy of
   the game. version.json (never cached) names the current build: boot with a different one -> clear it all and
   reload; the service worker (see tools/build_web.py) tells an open page when it was replaced. The game reloads
   itself from the main menu (updateReady), never in the middle of a match. */
const BUILD = '1.7.10.1793389152';
window.stickshot.updateReady = false;
window.stickshot.gameStarted = false;
function currentBuild() {
	const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
	const timer = ctl ? setTimeout(function () { ctl.abort(); }, 4000) : 0;
	return fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
		.then(function (r) { clearTimeout(timer); return r.ok ? r.json() : null; })
		.then(function (j) { return j && j.build ? String(j.build) : null; })
		.catch(function () { clearTimeout(timer); return null; });
}
function isStale(b) { return !!b && BUILD.indexOf('__') !== 0 && b !== BUILD; }
/* Drop the service worker and its cache first: with it still in charge, the refresh below would be answered from
   its (old) cache. Then refresh the browser's own cached copies (an unchanged file is just a quick 304), so the
   reload can only pick up files of one and the same version. */
function dropServiceWorker() {
	if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) return Promise.resolve();
	return navigator.serviceWorker.getRegistrations()
		.then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
		.then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; })
		.catch(function () {});
}
window.stickshot.reloadNow = function () {
	const files = ['index.js', 'index.wasm.gz', 'index.pck', 'index.html'];
	dropServiceWorker()
		.then(function () { return Promise.all(files.map(function (f) { return fetch(f, { cache: 'no-cache' }).then(function (r) { return r.blob(); }).catch(function () {}); })); })
		.then(function () { location.reload(); });
};
function bootCheck(go) {
	currentBuild().then(function (b) {
		if (isStale(b)) {
			let tried = '';
			try { tried = sessionStorage.getItem('ss_reload') || ''; } catch (e) {}
			if (tried !== b) {  /* (once per build: a server that can't be reached never loops) */
				try { sessionStorage.setItem('ss_reload', b); } catch (e) {}
				window.stickshot.reloadNow();
				return;
			}
		}
		go();
	});
}
function checkWhileOpen() {
	if (window.stickshot.updateReady) return;
	currentBuild().then(function (b) { if (isStale(b)) window.stickshot.updateReady = true; });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) checkWhileOpen(); });
setInterval(checkWhileOpen, 10 * 60 * 1000);
if ('serviceWorker' in navigator) {
	navigator.serviceWorker.addEventListener('message', function (e) {
		if (!e.data || e.data.type !== 'update') return;
		try { (e.source || navigator.serviceWorker.controller).postMessage({ type: 'ack' }); } catch (err) {}
		window.stickshot.updateReady = true;
		if (!window.stickshot.gameStarted || performance.now() < 20000) window.stickshot.reloadNow();  /* (just opened: nothing to lose) */
	});
}

/* Keep the screen awake while playing. */
(function () {
	let lock = null;
	async function take() {
		try { if (navigator.wakeLock && !document.hidden) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
	}
	document.addEventListener('visibilitychange', take);
	document.addEventListener('pointerdown', function once() { take(); document.removeEventListener('pointerdown', once); });
})();

/* A phone goes fullscreen (and landscape) on the first tap: no address bar over the game. */
document.addEventListener('touchend', function once() {
	document.removeEventListener('touchend', once);
	if (window.stickshot.touch() && !document.fullscreenElement) window.stickshot.fullscreen();
});

/* No browser gestures on the game. */
function inTextBox(e) { return e.target && e.target.closest && e.target.closest('#tin'); }
document.addEventListener('contextmenu', function (e) { if (!inTextBox(e)) e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { if (!inTextBox(e)) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', function (e) {
	if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(e.code) >= 0 && document.activeElement === document.getElementById('canvas')) e.preventDefault();
});

(function () {
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length > 0) {
		fail('This browser can not run the game.\n' + missing.join('\n'));
		return;
	}
	if (engine.installServiceWorker) { try { Promise.resolve(engine.installServiceWorker()).catch(function () {}); } catch (e) {} }
	bootCheck(function () {
	window.stickshot.gameStarted = true;
	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) {
				barEl.classList.remove('wait');
				fillEl.style.width = Math.min(100, (current / total) * 100) + '%';
			}
		},
	}).then(function () {
		bootEl.classList.add('done');
		setTimeout(function () { bootEl.style.display = 'none'; }, 500);
		document.getElementById('canvas').focus();
	}, function (err) {
		fail('The game did not start.\n' + (err && err.message ? err.message : err));
	});
	});
})();
</script>
